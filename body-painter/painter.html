<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Body map</title><link rel="stylesheet" href="painter.css"></head>
<body><main><div id="skin-paint">
  <div class="mode-toolbar" role="group" aria-label="Interaction mode"><div class="mode-buttons"><button class="btn" data-mode="paint" aria-pressed="true">Paint</button><button class="btn" data-mode="rotate" aria-pressed="false">Rotate</button><button class="btn" data-mode="erase" aria-pressed="false">Erase</button></div><div class="edit-buttons"><button class="btn quiet" id="sp-undo">Undo</button><button class="btn quiet" id="sp-clear">Clear</button></div></div>
  <div class="stage-wrap"><div id="sp-stage" role="img" aria-label="Rotatable body model. Drag to paint; use sliders to raise the arms."></div><div class="view-toolbar" aria-label="Model views"><button class="btn" id="sp-front">Front</button><button class="btn" id="sp-back">Back</button><button class="btn" id="sp-leftview">Side</button></div></div>
  <p class="text-small text-muted" id="sp-hint">Paint on the body · Right-drag to rotate</p>
  <details class="more-tools"><summary>Brush & model options</summary><div class="tool-content"><div class="viz-controls"><label class="form-label">Mark color<select class="form-select" id="sp-color"><option value="0">Coral</option><option value="1">Blue</option><option value="2">Purple</option></select></label><label class="form-label">Brush size<input class="form-range" id="sp-size" aria-label="Brush size" type="range" min="1" max="8" value="3"></label></div><div class="viz-controls"><label class="form-label">Left arm <output id="sp-lv">0°</output><input class="form-range" id="sp-left" aria-label="Left arm angle" type="range" min="0" max="120" value="0"></label><label class="form-label">Right arm <output id="sp-rv">0°</output><input class="form-range" id="sp-right" aria-label="Right arm angle" type="range" min="0" max="120" value="0"></label></div><div class="viz-row"><span class="text-muted">More views</span><button class="btn" id="sp-top">Top</button><button class="btn" id="sp-bottom">Bottom</button></div></div></details>
  <p id="sp-status" class="text-small status" aria-live="polite">Loading body model…</p>
</div><p class="credit">Model: <a href="https://www.innerscene.com/tools/library/3d-parts/human-base-mesh-with-editable-53-bone-rig-8e7c8ab1" target="_blank" rel="noreferrer">MakeHuman / Innerscene</a> · CC0 · Illustrative pose</p></main>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script><script type="module" src="./app.js?v=symptom-flow"></script>
</body></html>
